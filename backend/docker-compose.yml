services:
  db:
    image: postgres:16-alpine
    container_name: relator_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relator_crm
    ports:
      # 5433 no host evita conflito com outros Postgres locais (container usa 5432)
      - '5433:5432'
    volumes:
      - relator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d relator_crm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  relator_pgdata:
